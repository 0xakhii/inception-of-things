# ──────────────────────────────────────────────────
# Minimal GitLab Helm values for local K3d cluster
# Disables everything non-essential to save resources
# ──────────────────────────────────────────────────

global:
  psql:
    host: postgres.database.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      secret: gitlab-postgresql-password
      key: password

  redis:
    host: redis.cache.svc.cluster.local
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis-password
      key: redis-password
  hosts:
    domain: gitlab.local
    https: false
  ingress:
    configureCertmanager: false
    class: traefik
    tls:
      enabled: false
  shell:
    port: 32022
  edition: ce
  kas:
    enabled: false
  pages:
    enabled: false
  appConfig:
    enableUsagePing: false
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: connection

# ── Disable heavyweight sub-charts ──

certmanager:
  enabled: false

certmanager-issuer:
  email: info@gitlab.com

nginx-ingress:
  enabled: false

prometheus:
  install: false

gitlab-runner:
  install: false

registry:
  enabled: false

# ── Core GitLab components — minimal resources ──

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2.5Gi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1.5Gi
  gitaly:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  kas:
    enabled: false
  toolbox:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# ── Bundled PostgreSQL & Redis — keep but minimize ──

postgresql:
  metrics:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

redis:
  metrics:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Disable bundled PostgreSQL and Redis when using external services.
postgresql:
  install: false

redis:
  install: false