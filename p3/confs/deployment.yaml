apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: 0xakhi/portfolio:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: portfolio
  ports:
    - port: 8888
      targetPort: 80
