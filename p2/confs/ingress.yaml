apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    # HOST app1.com → app1
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-one-svc
                port:
                  number: 80
    # HOST app2.com → app2
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-two-svc
                port:
                  number: 80
    # Default fallback → app3 (when no host matches)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-three-svc
                port:
                  number: 80

