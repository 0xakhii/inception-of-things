# ──────────────────────────────────────────────────
# Minimal GitLab Helm values for local K3d cluster
# Uses external PostgreSQL, Redis, and MinIO (object storage)
# deployed in the "database" namespace
# ──────────────────────────────────────────────────

global:
  # ── External PostgreSQL ──
  psql:
    host: postgres.database.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      secret: gitlab-postgresql-password
      key: password

  # ── External Redis ──
  redis:
    host: redis.database.svc.cluster.local
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis-password
      key: redis-password

  # ── MinIO / Object Storage ──
  minio:
    enabled: false

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: connection
    lfs:
      bucket: gitlab-lfs
    artifacts:
      bucket: gitlab-artifacts
    uploads:
      bucket: gitlab-uploads
    packages:
      bucket: gitlab-packages
    externalDiffs:
      enabled: true
      bucket: gitlab-mr-diffs
    ciSecureFiles:
      enabled: true
      bucket: gitlab-ci-secure-files
    dependencyProxy:
      enabled: true
      bucket: gitlab-dependency-proxy

  # ── Registry Object Storage ──
  registry:
    bucket: gitlab-registry

  toolbox:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

certmanager-issuer:
  email: info@gitlab.com

# ── Disable bundled PostgreSQL — using external ──
postgresql:
  install: false

# ── Disable bundled Redis — using external ──
redis:
  install: false

# ── Disable bundled MinIO — using external ──
minio:
  install: false

# ── Registry storage backend — use external MinIO via S3 API ──
registry:
  storage:
    secret: gitlab-registry-storage
    key: config
